name: Deploy to Production

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -s -X POST https://www.videohunt.top/api/deploy \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.DEPLOY_TOKEN }}\"}"
