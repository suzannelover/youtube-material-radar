name: Deploy to Production

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<< "$SSH_KEY"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -s" << 'ENDSCRIPT'
          set -e
          cd /opt/youtube-radar
          echo "=== [1/4] git pull ==="
          git pull origin dev

          echo "=== [2/4] pip install ==="
          source venv/bin/activate
          pip install -r requirements.txt -q
          deactivate

          echo "=== [3/4] restart gunicorn ==="
          sudo systemctl restart youtube-radar

          echo "=== [4/4] health check ==="
          sleep 2
          bash deploy/check.sh
          ENDSCRIPT
