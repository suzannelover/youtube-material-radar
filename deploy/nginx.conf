# Nginx 配置
# 放置路径：/etc/nginx/sites-available/youtube-radar
# 启用：ln -s /etc/nginx/sites-available/youtube-radar /etc/nginx/sites-enabled/
# 重载：nginx -t && systemctl reload nginx

# 替换 YOUR_DOMAIN 为实际域名
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── SSL（certbot 自动生成）──
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ── 上传大小限制 ──
    client_max_body_size 200m;
    client_body_timeout 300s;

    # ── 安全头 ──
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # ── 下载路由：Nginx 直接 serve，不经过 Flask ──
    location /api/clip_v2/download/ {
        alias /opt/youtube-radar/outputs/clips/;
        add_header Content-Disposition 'attachment';
    }

    # ── API：反代到 Gunicorn ──
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 前端静态页面 ──
    location / {
        root /opt/youtube-radar;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
