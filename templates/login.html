<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — YouTube 素材雷达</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    color: #e4e4ef;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 背景光晕 */
  .bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    pointer-events: none;
  }
  .bg-glow.a {
    width: 500px; height: 500px;
    background: #7c6af7;
    top: -150px; left: -100px;
  }
  .bg-glow.b {
    width: 400px; height: 400px;
    background: #e8ff47;
    bottom: -120px; right: -80px;
  }

  /* 卡片 */
  .login-card {
    position: relative;
    width: 380px;
    max-width: 90vw;
    background: rgba(17, 17, 24, 0.8);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 48px 36px 40px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    animation: fadeIn .6s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 标题 */
  .logo-line {
    font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: #e8ff47;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    color: #fff;
  }
  .subtitle {
    font-size: 12px;
    color: #5a5a72;
    margin-bottom: 36px;
    line-height: 1.6;
  }

  /* 表单 */
  .field {
    margin-bottom: 20px;
  }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 1px;
    color: #5a5a72;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    padding: 12px 14px;
    color: #e4e4ef;
    font-size: 14px;
    outline: none;
    transition: border-color .2s, background .2s;
  }
  .field input:focus {
    border-color: rgba(232, 255, 71, 0.4);
    background: rgba(255, 255, 255, 0.06);
  }
  .field input::placeholder {
    color: #3a3a4a;
  }

  /* 登录按钮 */
  .btn-login {
    width: 100%;
    background: #e8ff47;
    color: #0a0a0f;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity .15s, transform .15s;
    margin-top: 8px;
  }
  .btn-login:hover { opacity: .85; transform: translateY(-1px); }
  .btn-login:active { transform: translateY(0); }

  /* 错误提示 */
  .error-msg {
    background: rgba(255, 80, 80, 0.08);
    border: 1px solid rgba(255, 80, 80, 0.2);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: #ff6b6b;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .error-msg::before { content: '⚠'; }

  /* 底部 */
  .footer-note {
    text-align: center;
    margin-top: 28px;
    font-size: 11px;
    color: #3a3a4a;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="bg-glow a"></div>
<div class="bg-glow b"></div>

<div class="login-card">
  <div class="logo-line">▸ YouTube 素材雷达</div>
  <h1>登录</h1>
  <div class="subtitle">内部工具 · 仅授权用户可用</div>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label>用户名</label>
      <input type="text" name="username" placeholder="请输入用户名" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" name="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login">登录</button>
  </form>

  <div class="footer-note">YouTube 素材雷达 · 内部系统</div>
</div>

</body>
</html>
